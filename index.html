<!DOCTYPE html>
<html lang="en" class="h-full">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Workspace</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-zinc-50 dark:bg-zinc-950 h-full flex flex-col transition-colors duration-300">

  <header class="border-b border-zinc-200 dark:border-zinc-800 p-4 bg-white/80 dark:bg-zinc-900/80 backdrop-blur sticky top-0">
    <div class="max-w-3xl mx-auto flex justify-between items-center">
      <h1 id="app-title" class="font-bold text-sm">Loading...</h1>
      <div class="flex items-center gap-4">
        <span id="limit-indicator" class="text-[10px] font-mono bg-zinc-200 dark:bg-zinc-800 px-2 py-1 rounded">3/3 Free Messages</span>
        <button id="theme-toggle" class="text-xs px-2 py-1 bg-zinc-200 dark:bg-zinc-800 rounded">Theme</button>
      </div>
    </div>
  </header>

  <main id="chat-box" class="flex-1 max-w-3xl w-full mx-auto p-4 overflow-y-auto space-y-4"></main>

  <footer class="p-4 border-t border-zinc-200 dark:border-zinc-800">
    <div class="max-w-3xl mx-auto mb-2 text-center" id="upgrade-prompt">
      <a href="#" id="upgrade-link" class="text-xs text-blue-600 dark:text-blue-400 underline font-medium">Upgrade to Pro for Unlimited Access</a>
    </div>
    <form id="chat-form" class="max-w-3xl mx-auto flex gap-2">
      <input id="user-input" class="flex-1 p-2 border rounded-xl bg-zinc-100 dark:bg-zinc-900 dark:border-zinc-800" placeholder="Ask anything...">
      <button type="submit" class="px-5 py-2 bg-zinc-900 text-white dark:bg-zinc-50 dark:text-zinc-900 rounded-xl font-medium">Send</button>
    </form>
  </footer>

  <script>
    let upiUrl = "", messageCount = 0;
    const MAX_FREE = 3;

    async function init() {
      const res = await fetch('/.netlify/functions/chat?init=true');
      const data = await res.json();
      document.getElementById('app-title').textContent = data.appName;
      upiUrl = data.upiUrl;
      document.getElementById('upgrade-link').href = upiUrl;
      updateLimitUI();
    }

    function updateLimitUI() {
      const remaining = Math.max(0, MAX_FREE - messageCount);
      document.getElementById('limit-indicator').textContent = `${remaining}/${MAX_FREE} Free Messages`;
    }

    document.getElementById('chat-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const input = document.getElementById('user-input');
      if (!input.value.trim() || messageCount >= MAX_FREE) return;
      
      messageCount++;
      updateLimitUI();
      
      const msg = input.value;
      input.value = '';
      const chatBox = document.getElementById('chat-box');
      chatBox.innerHTML += `<div class="text-right text-sm">You: ${msg}</div>`;
      
      const res = await fetch('/.netlify/functions/chat', { 
        method: 'POST', body: JSON.stringify({ prompt: msg }) 
      });
      const data = await res.text();
      chatBox.innerHTML += `<div class="text-left text-sm bg-zinc-100 p-3 rounded-xl dark:bg-zinc-900">Bot: ${data}</div>`;
    });

    document.getElementById('theme-toggle').onclick = () => document.documentElement.classList.toggle('dark');
    init();
  </script>
</body>
</html>
