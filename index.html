<!DOCTYPE html>
<html lang="en" class="h-full">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Workspace</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', '-apple-system', 'BlinkMacSystemFont', 'Segoe UI', 'Roboto', 'sans-serif'],
          }
        }
      }
    }
  </script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Inter', sans-serif; }
    ::-webkit-scrollbar { width: 5px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: #d4d4d8; border-radius: 99px; }
    .dark ::-webkit-scrollbar-thumb { background: #3f3f46; }
  </style>
</head>
<body class="bg-zinc-50 text-zinc-900 dark:bg-zinc-950 dark:text-zinc-50 h-full flex flex-col antialiased transition-colors duration-300">

  <header class="border-b border-zinc-200 bg-white/80 backdrop-blur dark:border-zinc-800 dark:bg-zinc-900/80 sticky top-0 z-10 w-full transition-colors duration-300">
    <div class="max-w-3xl mx-auto px-4 h-14 flex justify-between items-center">
      <div class="flex items-center gap-2.5">
        <div class="h-6 w-6 rounded-md bg-zinc-900 dark:bg-zinc-100 flex items-center justify-center shadow-sm">
          <span class="text-[11px] font-bold text-white dark:text-zinc-900">AI</span>
        </div>
        <span id="app-title" class="text-sm font-medium tracking-tight opacity-90">Loading Workspace...</span>
      </div>
      
      <button id="theme-toggle" class="p-2 rounded-lg hover:bg-zinc-200/60 dark:hover:bg-zinc-800/60 text-zinc-500 dark:text-zinc-400 transition-all" aria-label="Toggle Theme">
        <svg id="sun-icon" class="w-4 h-4 hidden" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
          <path stroke-linecap="round" stroke-linejoin="round" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364-6.364l-.707.707M6.343 17.657l-.707.707M16.243 17.657l.707.707M6.343 6.343l.707-.707M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
        </svg>
        <svg id="moon-icon" class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
          <path stroke-linecap="round" stroke-linejoin="round" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z" />
        </svg>
      </button>
    </div>
  </header>

  <main id="chat-box" class="flex-1 max-w-3xl w-full mx-auto px-4 py-6 overflow-y-auto space-y-6 flex flex-col justify-start">
    <div id="welcome-message" class="text-center my-auto py-12 flex flex-col items-center justify-center opacity-0 transition-opacity duration-500">
      <div class="h-10 w-10 rounded-full bg-zinc-100 dark:bg-zinc-900 border border-zinc-200 dark:border-zinc-800 flex items-center justify-center text-base mb-3 shadow-xs">🔒</div>
      <p class="text-xs font-medium text-zinc-400 dark:text-zinc-500 max-w-xs leading-relaxed">Secure gateway active. All messages proxy directly through localized endpoints.</p>
    </div>
  </main>

  <footer class="border-t border-zinc-200 bg-white dark:border-zinc-800 dark:bg-zinc-950 p-4 w-full transition-colors duration-300">
    <div class="max-w-3xl mx-auto">
      <form id="chat-form" class="relative flex items-center bg-zinc-100 dark:bg-zinc-900 border border-zinc-200 dark:border-zinc-800/80 rounded-xl px-3 py-2 focus-within:ring-1 focus-within:ring-zinc-400 dark:focus-within:ring-zinc-600 focus-within:border-transparent transition-all">
        <input 
          id="user-input" 
          type="text" 
          placeholder="Ask anything..." 
          autocomplete="off" 
          class="w-full bg-transparent text-sm text-zinc-900 dark:text-zinc-100 placeholder-zinc-400 dark:placeholder-zinc-500 focus:outline-none pr-12 pl-1 py-1"
        >
        <button 
          type="submit" 
          class="absolute right-2 px-3.5 py-1.5 bg-zinc-900 hover:bg-zinc-800 text-white dark:bg-zinc-50 dark:hover:bg-zinc-200 dark:text-zinc-900 rounded-lg text-xs font-medium transition-all shadow-xs"
        >
          Send
        </button>
      </form>
    </div>
  </footer>

  <script>
    const htmlEl = document.documentElement;
    const themeToggleBtn = document.getElementById('theme-toggle');
    const sunIcon = document.getElementById('sun-icon');
    const moonIcon = document.getElementById('moon-icon');
    const chatBox = document.getElementById('chat-box');
    const chatForm = document.getElementById('chat-form');
    const userInput = document.getElementById('user-input');
    const appTitle = document.getElementById('app-title');
    const welcomeMessage = document.getElementById('welcome-message');

    let appName = "AI Chat";

    // 1. Fix Theme Mechanics Flawlessly
    function applyTheme(theme) {
      if (theme === 'dark') {
        htmlEl.classList.add('dark');
        sunIcon.classList.remove('hidden');
        moonIcon.classList.add('hidden');
      } else {
        htmlEl.classList.remove('dark');
        sunIcon.classList.add('hidden');
        moonIcon.classList.remove('hidden');
      }
    }

    // Initialize Theme State
    const savedTheme = localStorage.getItem('chat_ui_theme') || 
      (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
    applyTheme(savedTheme);

    // Toggle Click Event
    themeToggleBtn.addEventListener('click', () => {
      const isDark = htmlEl.classList.contains('dark');
      const newTheme = isDark ? 'light' : 'dark';
      localStorage.setItem('chat_ui_theme', newTheme);
      applyTheme(newTheme);
    });

    // 2. Load API Setup Appends
    async function fetchConfig() {
      try {
        const res = await fetch('/.netlify/functions/chat?init=true');
        const data = await res.json();
        appName = data.appName || "AI Workspace";
        appTitle.textContent = appName;
      } catch (e) {
        appTitle.textContent = "AI Workspace";
      } finally {
        welcomeMessage.classList.remove('opacity-0');
      }
    }
    fetchConfig();

    // 3. UI Message Component Node Generation
    function appendMessage(sender, text, isError = false) {
      const welcome = document.getElementById('welcome-message');
      if (welcome) welcome.remove();

      const msgContainer = document.createElement('div');
      msgContainer.className = `flex flex-col space-y-1 w-full ${sender === 'user' ? 'items-end' : 'items-start'}`;

      const metaSpan = document.createElement('span');
      metaSpan.className = 'text-[11px] font-medium opacity-40 px-1 tracking-tight';
      metaSpan.textContent = sender === 'user' ? 'You' : appName;

      const blockDiv = document.createElement('div');
      blockDiv.className = `max-w-[85%] rounded-2xl px-4 py-3 text-sm leading-relaxed whitespace-pre-wrap transition-all duration-200 ${
        sender === 'user' 
          ? 'bg-zinc-900 text-zinc-50 dark:bg-zinc-100 dark:text-zinc-900 shadow-sm font-normal' 
          : isError 
            ? 'bg-red-50 text-red-800 border border-red-200 dark:bg-red-950/20 dark:text-red-400 dark:border-red-900/50'
            : 'bg-zinc-200/60 text-zinc-900 dark:bg-zinc-900 dark:text-zinc-100'
      }`;
      blockDiv.textContent = text;

      msgContainer.appendChild(metaSpan);
      msgContainer.appendChild(blockDiv);
      chatBox.appendChild(msgContainer);
      chatBox.scrollTop = chatBox.scrollHeight;
      return blockDiv;
    }

    // 4. API Request Processing
    chatForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      const message = userInput.value.trim();
      if (!message) return;

      appendMessage('user', message);
      userInput.value = '';
      
      const botResponseDiv = appendMessage('bot', 'Thinking...');

      try {
        const response = await fetch('/.netlify/functions/chat', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ prompt: message })
        });

        const data = await response.text();
        if (!response.ok) throw new Error(data);

        botResponseDiv.textContent = data;
      } catch (error) {
        botResponseDiv.parentElement.remove();
        appendMessage('bot', `System Notice: ${error.message}`, true);
      }
    });
  </script>
</body>
</html>
