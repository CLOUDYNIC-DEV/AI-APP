<!DOCTYPE html>
<html lang="en" class="h-full">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Workspace</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>::-webkit-scrollbar { width: 5px; } ::-webkit-scrollbar-thumb { background: #d4d4d8; border-radius: 99px; }</style>
</head>
<body class="bg-zinc-50 dark:bg-zinc-950 h-full flex flex-col transition-colors duration-300">

  <header class="border-b border-zinc-200 dark:border-zinc-800 p-4 sticky top-0 bg-white/80 dark:bg-zinc-900/80 backdrop-blur">
    <div class="max-w-3xl mx-auto flex justify-between items-center">
      <span id="app-title" class="font-bold text-sm">Loading Workspace...</span>
      <button id="theme-toggle" class="text-xs px-3 py-1 bg-zinc-200 dark:bg-zinc-800 rounded-lg">Theme</button>
    </div>
  </header>

  <main id="chat-box" class="flex-1 max-w-3xl w-full mx-auto p-4 overflow-y-auto space-y-4"></main>

  <footer class="p-4 border-t border-zinc-200 dark:border-zinc-800">
    <form id="chat-form" class="max-w-3xl mx-auto flex gap-2">
      <input id="user-input" class="flex-1 p-2 border rounded-xl bg-zinc-100 dark:bg-zinc-900 dark:border-zinc-800" placeholder="Ask anything...">
      <button type="submit" class="px-5 py-2 bg-zinc-900 text-white dark:bg-zinc-50 dark:text-zinc-900 rounded-xl font-medium">Send</button>
    </form>
  </footer>

  <script>
    let upiUrl = "", appName = "AI Chat", messageCount = 0;
    const MAX_FREE = 3;

    async function init() {
      const res = await fetch('/.netlify/functions/chat?init=true');
      const data = await res.json();
      document.getElementById('app-title').textContent = data.appName;
      upiUrl = data.upiUrl;
    }

    function showUpgrade() {
      const modal = document.createElement('div');
      modal.className = "fixed inset-0 bg-black/50 flex items-center justify-center p-4 z-50";
      modal.innerHTML = `
        <div class="bg-white dark:bg-zinc-900 p-6 rounded-2xl max-w-sm w-full border border-zinc-200 dark:border-zinc-800 text-center">
          <h2 class="font-bold text-lg mb-2">Upgrade to Pro</h2>
          <p class="text-sm opacity-60 mb-6">You've reached your free limit. Unlock unlimited access!</p>
          <a href="${upiUrl}" class="block w-full bg-zinc-900 text-white dark:bg-zinc-50 dark:text-zinc-900 py-3 rounded-xl font-bold">Pay via UPI</a>
          <button onclick="this.parentElement.parentElement.remove()" class="mt-4 text-xs opacity-50">Close</button>
        </div>
      `;
      document.body.appendChild(modal);
    }

    document.getElementById('chat-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const input = document.getElementById('user-input');
      if (!input.value.trim()) return;
      if (messageCount >= MAX_FREE) { showUpgrade(); return; }
      
      messageCount++;
      const msg = input.value;
      input.value = '';
      
      const chatBox = document.getElementById('chat-box');
      chatBox.innerHTML += `<div class="text-right text-sm">You: ${msg}</div>`;
      
      const res = await fetch('/.netlify/functions/chat', { 
        method: 'POST', body: JSON.stringify({ prompt: msg }) 
      });
      const data = await res.text();
      chatBox.innerHTML += `<div class="text-left text-sm bg-zinc-100 p-3 rounded-xl dark:bg-zinc-900">Bot: ${data}</div>`;
    });

    document.getElementById('theme-toggle').onclick = () => document.documentElement.classList.toggle('dark');
    init();
  </script>
</body>
</html>
